<header class="navbar-wrapper">
  <nav class="navbar-global" [class.landing-nav]="isLanding()" aria-label="Principal">
    <a routerLink="/home" class="brand-link" aria-label="OvalTrack, ir al inicio">
      <img
        class="brand-icon"
        [src]="themeService.theme() === 'light' ? 'assets/brand/OvalTrack-fondo-claro.png' : 'assets/brand/OvalTrack-fondo-oscuro.png'"
        alt=""
      >
      @if (currentUser() && clubName() && !navbarMode.isCompact()) {
        <small class="brand-subtitle">{{ clubName() }}</small>
      }
    </a>

    @if (currentUser()) {
      <app-nav-modules class="navbar-modules" />

      <div class="navbar-status">
        @if (liveMatch(); as match) {
          <app-nav-live-match [match]="match" />
        }
        <app-nav-sync-status [status]="syncStatus()" (activate)="userMenu.open()" />
        <app-user-menu #userMenu />
      </div>
    } @else {
      <div class="navbar-status">
        <button
          type="button"
          class="theme-toggle"
          (click)="themeService.toggleTheme()"
          [attr.aria-label]="themeService.theme() === 'dark' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
        >
          <i class="bi" [class.bi-sun]="themeService.theme() === 'dark'" [class.bi-moon]="themeService.theme() === 'light'" aria-hidden="true"></i>
        </button>
        @if (authPage() !== 'login') {
          <a routerLink="/auth/login" class="btn-outline navbar-cta">Iniciar sesión</a>
        }
        @if (authPage() !== 'register') {
          <a routerLink="/auth/register" class="btn-invite navbar-cta">Crear cuenta</a>
        }
      </div>
    }
  </nav>
</header>
