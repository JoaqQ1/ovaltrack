<div class="modal-backdrop" (click)="close()">
  <div
    class="form-card"
    role="dialog"
    aria-modal="true"
    aria-labelledby="invite-modal-title"
    (click)="$event.stopPropagation()"
  >
    <header class="form-card-header">
      <div>
        <h2 id="invite-modal-title" class="form-card-title">Invitar jugador</h2>
        <p class="form-card-subtitle">
          Selecciona un jugador para invitarlo a OvalTrack
        </p>
      </div>
      <button
        type="button"
        class="btn-icon"
        aria-label="Cerrar"
        (click)="close()"
      >
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.4"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
    </header>

    <div class="form-card-body">
      <label for="invite-search" class="field-label">Jugador</label>
      <div class="search">
        <svg
          class="search-icon"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <circle cx="11" cy="11" r="7" />
          <path d="M20 20l-4-4" />
        </svg>
        <input
          id="invite-search"
          class="form-control"
          type="text"
          placeholder="Buscar por nombre o email"
          autocomplete="off"
          [value]="query()"
          (input)="onSearch($event)"
        />
      </div>

      <div class="player-list" role="radiogroup" aria-label="Jugadores">
        @for (player of filteredPlayers; track player.id) {
          <label
            class="player-row"
            [class.is-selected]="selectedId() === player.id"
          >
            <input
              class="sr-only"
              type="radio"
              name="invite-player"
              [value]="player.id"
              [checked]="selectedId() === player.id"
              (change)="select(player)"
            />
            <span class="avatar" aria-hidden="true"
              >{{ initials(player.firstName) }}{{ initials(player.lastName) }}</span
            >
            <span class="player-info">
              <span class="player-name"
                >{{ player.firstName }}, {{ player.lastName }}</span
              >
              <span class="player-email">{{ player.contactEmail }}</span>
            </span>
            <span class="radio-mark" aria-hidden="true">
              @if (selectedId() === player.id) {
                <svg
                  width="12"
                  height="12"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="3.4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M5 12.5l4.5 4.5L19 7.5" />
                </svg>
              }
            </span>
          </label>
        } @empty {
          <p class="empty">No se encontraron jugadores para tu búsqueda.</p>
        }
      </div>
    </div>

    <app-pagination
      [totalPages]="resultsPage.totalPages"
      [currentPage]="currentPage"
      (pageChangeRequested)="onPageChangeRequested($event)"
      [number]="resultsPage.number"
      [hidden]="resultsPage.numberOfElements < 1"
    >
    </app-pagination>

    <footer class="form-card-footer">
      <button type="button" class="btn btn-outline" (click)="close()">
        Cancelar
      </button>
      <button
        type="button"
        class="btn btn-invite"
        [disabled]="!canSend"
        (click)="send()"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M21 3L10 14" />
          <path d="M21 3l-7 18-4-7-7-4 18-7z" />
        </svg>
        {{ sending ? "Enviando…" : "Enviar solicitud" }}
      </button>
    </footer>
  </div>
</div>
