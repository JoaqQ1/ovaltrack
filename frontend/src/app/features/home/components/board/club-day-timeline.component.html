@if (layout(); as layout) {
  <div class="timeline">
    <div class="axis" aria-hidden="true">
      @for (hour of hours(); track hour.label) {
        <span class="axis-hour" [style.--left]="hour.left + '%'">{{ hour.label }}</span>
      }
    </div>
    <ul class="track" [style.--track-height]="trackHeight() + 'px'" aria-label="Partidos del día">
      @for (entry of positioned(); track entry.item.id) {
        <li class="slot" [class]="'slot status-' + entry.item.status"
            [style.--left]="entry.left + '%'" [style.--width]="entry.width + '%'" [style.--top]="entry.top + 'px'">
          <span class="slot-time">{{ entry.item.timeLabel }}<span class="slot-detail"> · {{ entry.item.detail }}</span></span>
          <span class="slot-title">{{ entry.item.title }}</span>
        </li>
      }
      @if (nowLeft(); as left) {
        <li class="now" aria-hidden="true" [style.--left]="left + '%'"><span class="now-label">AHORA</span></li>
      }
    </ul>
  </div>
}
