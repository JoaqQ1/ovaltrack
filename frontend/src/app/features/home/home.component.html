<main class="container py-5">
  <section class="card border-0 shadow-sm">
    <div class="card-body p-4 p-md-5 text-center">
      <span class="badge text-bg-primary mb-3">Área protegida</span>
      <h1 class="display-6">Bienvenido a OvalTrack</h1>
      <p class="lead text-secondary mb-0">Has accedido correctamente a la página protegida por autenticación.</p>
      <button type="button" class="btn btn-outline-success mt-4" (click)="goToCargaEnVivo()">
        Carga en vivo
      </button>
      <button type="button" class="btn btn-outline-danger mt-4" (click)="logout()">
        Cerrar sesión
      </button>
    </div>
  </section>
</main>
