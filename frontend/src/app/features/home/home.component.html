@if (currentUser() !== null) {
  @switch (view()) {
    @case ('coach') {
      <app-coach-home />
    }
    @case ('admin') {
      <app-admin-home />
    }
    @case ('player') {
      <app-player-home />
    }
    @case ('other') {
      <app-other-home />
    }
    @default {
      <main class="layout-container page">
        <div class="home-loading sk" aria-hidden="true"></div>
      </main>
    }
  }
} @else {
  <app-landing />
}
