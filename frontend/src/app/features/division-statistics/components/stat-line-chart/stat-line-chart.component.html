<div class="legend">
  @for (line of lines; track line.name) {
    <span class="legend-item">
      <svg width="22" height="8" aria-hidden="true">
        <line x1="0" y1="4" x2="22" y2="4" [attr.stroke]="line.color" stroke-width="2.5"
          [attr.stroke-dasharray]="line.dashed ? '5 4' : null" />
      </svg>
      {{ line.name }}
    </span>
  }
</div>

<svg class="chart" [attr.viewBox]="'0 0 ' + width + ' ' + height" role="img" preserveAspectRatio="xMidYMid meet">
  @for (grid of gridlines; track grid.y) {
    <line class="grid" [attr.x1]="plotLeft" [attr.x2]="plotRight" [attr.y1]="grid.y" [attr.y2]="grid.y" />
    <text class="axis-label" [attr.x]="plotLeft - 8" [attr.y]="grid.y + 4" text-anchor="end">{{ grid.label }}</text>
  }

  @for (tick of xTicks; track tick.x) {
    <text class="axis-label" [attr.x]="tick.x" [attr.y]="height - 12" text-anchor="middle">{{ tick.label }}</text>
  }

  @for (line of lines; track line.name) {
    @for (polyline of line.polylines; track $index) {
      <polyline class="line" [attr.points]="polyline" [attr.stroke]="line.color"
        [attr.stroke-dasharray]="line.dashed ? '6 5' : null" />
    }
    @for (point of line.points; track $index) {
      <circle class="point" [attr.cx]="point.x" [attr.cy]="point.y" r="4.5" [attr.fill]="line.color">
        <title>{{ point.tooltip }}</title>
      </circle>
      @if (showLabels) {
        <text class="point-label" [attr.x]="point.x" [attr.y]="point.labelY" [attr.fill]="line.color"
          text-anchor="middle">{{ point.label }}</text>
      }
    }
  }
</svg>
