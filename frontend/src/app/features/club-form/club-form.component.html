<div class="club-form-container">
  <h2>Registrar Nuevo Club</h2>

  <div *ngIf="mensajeError" class="error-message">
    {{ mensajeError }}
  </div>

  <form (ngSubmit)="guardarClub()" #form="ngForm">
    <div class="form-group">
      <label for="name">Nombre:</label>
      <input 
        type="text" 
        id="name" 
        name="name" 
        [(ngModel)]="club.name" 
        required 
        placeholder="Ej: Club Atlético..."
      />
    </div>

    <div class="form-group">
      <label for="city">Localidad:</label>
      <input 
        type="text" 
        id="city" 
        name="city" 
        [(ngModel)]="club.city" 
        placeholder="Ej: Madryn"
      />
    </div>

    <div class="form-group">
      <label for="adminUserId">Administrador:</label>
      <select 
        id="adminUserId" 
        name="adminUserId" 
        [(ngModel)]="club.adminUserId" 
        required
      >
        <option value="" disabled selected>Seleccione un administrador...</option>
        <option *ngFor="let user of usuarios" [value]="user.id">
          {{ user.name || user.email }}
        </option>
      </select>
    </div>

    <div class="form-actions">
      <button type="submit" [disabled]="!form.valid" class="btn-submit">Guardar Club</button>
      <a routerLink="/clubes" class="btn-cancel">Cancelar</a>
    </div>
  </form>
</div>
