<div class="pm">
  <!-- Banner de Error Semántico -->
  <div *ngIf="errorMessage() && !loading.pending()" class="alert-error" role="alert">
    <i class="bi bi-exclamation-triangle-fill"></i>
    <span>{{ errorMessage() }}</span>
  </div>

  <!-- Carga: la pelota aparece solo si tarda más de 100 ms -->
  <app-rugby-ball-loader *ngIf="loading.showIndicator()" class="pm-loading" message="Cargando eventos del partido…" />

  <!-- Contenido Principal: Grilla de Estación de Trabajo (Fase 1 y 2) -->
  <ng-container *ngIf="!loading.pending() && !errorMessage()">
    <!-- Área de KPIs: Strip Horizontal Compacto -->
    <div class="pm-area-kpi">
      <app-post-match-kpi-strip />
    </div>

    <!-- Área de Línea Temporal -->
    <div class="pm-area-timeline">
      <app-post-match-timeline #timeline (addEvent)="openCreateModal()" />
    </div>

    <!-- Área de Tabla Detallada -->
    <div class="pm-area-table">
      <app-post-match-table (editRequested)="onEditRequested()" (deleteRequested)="onDeleteRequested()"
                            (clearFiltersRequested)="timeline.clearAllFilters()" />
    </div>

    <!-- Área del Inspector Lateral (320px) -->
    <aside class="pm-area-inspector">
      <app-post-match-panel />
    </aside>
  </ng-container>

  <!-- Modal de Alta de Eventos Post-Partido (HU-8.4) -->
  <app-post-match-create-modal [isOpen]="showCreateModal()" [matchId]="matchId" (close)="closeCreateModal()" (created)="onEventCreated($event)" />
</div>
