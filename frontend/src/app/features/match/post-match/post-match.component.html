<div class="layout-container page pm">
  <!-- Page Header Integrado OvalTrack -->
  <header class="hud pm-area-hud">
    <div class="hud-brand">
      <div class="badge-tech">
        <span>Análisis • Post-partido</span>
      </div>
      <div class="brand-text">
        <h1 class="title">{{ userClubName() }} vs {{ opponent() }}</h1>
        <p class="club">Revisión de la carga: verificá que cada evento esté completo y correcto</p>
      </div>
    </div>

    <div class="hud-actions">
      <!-- Secundario a la izquierda -->
      <button 
        type="button" 
        class="btn btn-outline btn-hud" 
        (click)="comeBack()"
        aria-label="Volver a partidos"
        title="Volver a partidos"
      >
        <i class="bi bi-arrow-left"></i>
        <span class="hud-btn-text">Volver a partidos</span>
      </button>

      <!-- Primario Verde Sólido a la derecha -->
      <button 
        type="button" 
        class="btn-invite btn-hud" 
        (click)="openCreateModal()"
        aria-label="Agregar evento"
        title="Agregar evento"
      >
        <i class="bi bi-plus-lg"></i>
        <span class="hud-btn-text">Agregar evento</span>
      </button>
    </div>
  </header>

  <!-- Banner de Error Semántico -->
  <div *ngIf="errorMessage()" class="alert-error" role="alert">
    <i class="bi bi-exclamation-triangle-fill"></i>
    <span>{{ errorMessage() }}</span>
  </div>

  <!-- Estado de Carga con Skeletons Oficiales -->
  <div *ngIf="isLoading()" class="skeleton-state">
    <div class="sk-row" *ngFor="let i of [1, 2, 3, 4]">
      <div class="sk sk-avatar"></div>
      <div style="flex: 1">
        <div class="sk sk-line"></div>
        <div class="sk sk-line s"></div>
      </div>
      <div class="sk sk-block" style="max-width: 140px"></div>
      <div class="sk sk-pill"></div>
    </div>
  </div>

  <!-- Contenido Principal: Grilla de Estación de Trabajo (Fase 1) -->
  <ng-container *ngIf="!isLoading() && !errorMessage()">
    <!-- Área de KPIs -->
    <div class="pm-area-kpi">
      <app-post-match-kpis />
    </div>

    <!-- Área de Línea Temporal -->
    <div class="pm-area-timeline">
      <app-post-match-timeline />
    </div>

    <!-- Área de Tabla Detallada -->
    <div class="pm-area-table">
      <app-post-match-table (editRequested)="onEditRequested()" (deleteRequested)="onDeleteRequested()" />
    </div>

    <!-- Área del Inspector Lateral (320px) -->
    <aside class="pm-area-inspector">
      <app-post-match-panel />
    </aside>
  </ng-container>

  <!-- Modal de Alta de Eventos Post-Partido (HU-8.4) -->
  <app-post-match-create-modal [isOpen]="showCreateModal()" [matchId]="matchId" (close)="closeCreateModal()" />
</div>
