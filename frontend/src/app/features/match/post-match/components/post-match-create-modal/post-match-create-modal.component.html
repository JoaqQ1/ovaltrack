<div class="custom-modal-backdrop" *ngIf="isOpen">
  <div class="custom-modal-dialog">
    <div class="form-card w-100">
      <!-- Header -->
      <div class="form-card-header d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
          <div class="header-icon-box">
            <i class="bi bi-plus-circle-fill text-success"></i>
          </div>
          <div>
            <h5 class="form-card-title mb-0">Agregar Evento Post-Partido</h5>
            <small class="text-muted">Carga manual de acciones ocurridas durante el partido</small>
          </div>
        </div>
        <button type="button" class="btn-close" (click)="onClose()" [disabled]="isSubmitting()"></button>
      </div>

      <!-- Body -->
      <div class="form-card-body p-4">
        <!-- 1. Tipo de Evento -->
        <div class="mb-3">
          <label class="form-label fw-bold form-label-custom">Tipo de Evento *</label>
          <select class="form-control form-select" [(ngModel)]="eventTypeId">
            <option value="" disabled selected>-- Selecciona el tipo de acción --</option>
            <option *ngFor="let t of store.eventTypesList()" [value]="t.id">
              {{ t.name }} ({{ t.category }})
            </option>
          </select>
        </div>

        <!-- 2. Período (Fila 1 completa) -->
        <div class="mb-3">
          <label class="form-label fw-bold form-label-custom">Período *</label>
          <div class="d-flex gap-2">
            <button type="button"
                    class="btn segment-btn flex-fill"
                    [class.segment-btn--active]="period === 1"
                    (click)="period = 1">
              1° Tiempo (1T)
            </button>
            <button type="button"
                    class="btn segment-btn flex-fill"
                    [class.segment-btn--active]="period === 2"
                    (click)="period = 2">
              2° Tiempo (2T)
            </button>
          </div>
        </div>

        <!-- 3. Minuto del período (Fila 2 completa) -->
        <div class="mb-3">
          <label class="form-label fw-bold form-label-custom">Minuto del período *</label>
          <div class="input-group custom-input-group">
            <input type="number" 
                   class="form-control" 
                   [(ngModel)]="minute" 
                   min="0" 
                   max="100" 
                   placeholder="Ej: 15" />
            <span class="input-group-text">min</span>
          </div>
          <small class="text-muted d-block mt-1">Tiempo relativo al inicio del tiempo seleccionado</small>
        </div>

        <!-- 4. Posesión / Equipo -->
        <div class="mb-3">
          <label class="form-label fw-bold form-label-custom">Posesión / Equipo *</label>
          <div class="d-flex gap-2">
            <button type="button" 
                    class="btn segment-btn flex-fill" 
                    [class.segment-btn--active]="possession === 'OWN'"
                    (click)="possession = 'OWN'; onPossessionChange()">
              Propia (Local)
            </button>
            <button type="button" 
                    class="btn segment-btn flex-fill" 
                    [class.segment-btn--danger]="possession === 'OPPONENT'"
                    (click)="possession = 'OPPONENT'; onPossessionChange()">
              Rival (Visitante)
            </button>
            <button type="button" 
                    class="btn segment-btn flex-fill" 
                    [class.segment-btn--neutral]="possession === 'NEUTRAL'"
                    (click)="possession = 'NEUTRAL'; onPossessionChange()">
              Neutral
            </button>
          </div>
        </div>

        <!-- 5. Jugador Asociado (Opcional) -->
        <div class="mb-2">
          <label class="form-label fw-bold form-label-custom">
            Jugador Asociado
            <span class="fw-normal text-muted small">(opcional)</span>
          </label>
          <select class="form-control form-select" 
                  [(ngModel)]="playerId" 
                  [disabled]="possession === 'OPPONENT'">
            <option value="">-- Sin asignar (Sin jugador) --</option>
            <option *ngFor="let p of store.availablePlayers()" [value]="p.id">
              {{ p.jerseyNumber ? '#' + p.jerseyNumber + ' ' : '' }}{{ p.fullName }}
            </option>
          </select>
          <small *ngIf="possession === 'OPPONENT'" class="text-muted d-block mt-1">
            * Para el equipo rival no se asigna jugador individual.
          </small>
        </div>
      </div>

      <!-- Footer -->
      <div class="modal-footer-actions">
        <button type="button" class="btn btn-outline" (click)="onClose()" [disabled]="isSubmitting()">
          Cancelar
        </button>
        <button type="button" 
                class="btn btn-invite d-flex align-items-center justify-content-center gap-2" 
                (click)="save()" 
                [disabled]="isSubmitting()">
          <span *ngIf="isSubmitting()" class="spinner-border spinner-border-sm"></span>
          <span>{{ isSubmitting() ? 'Guardando...' : 'Guardar evento' }}</span>
        </button>
      </div>
    </div>
  </div>
</div>
