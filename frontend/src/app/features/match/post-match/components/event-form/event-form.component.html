<div class="event-form-container">
  <!-- 1. Tipo de Jugada -->
  <div class="form-group mb-2">
    <label class="form-label-sport">Tipo de jugada *</label>
    <select class="form-select custom-sport-select"
            [ngModel]="eventTypeId()"
            (ngModelChange)="onEventTypeChange($event)"
            [disabled]="disabled">
      <option value="" disabled>Seleccionar tipo de jugada...</option>
      <option *ngFor="let t of store.eventTypesList()" [value]="t.id">
        {{ t.name }}
      </option>
    </select>
  </div>

  <!-- 2. Equipo que ejecutó la acción (se guarda en teamPossession) -->
  <div class="form-group mb-2">
    <label class="form-label-sport">Equipo *</label>
    <div class="possession-segmented">
      <button type="button" 
              class="possession-segment-btn" 
              [class.active]="teamPossession() === 'OWN'"
              (click)="onPossessionChange('OWN')"
              [disabled]="disabled">
        Propia
      </button>
      <button type="button" 
              class="possession-segment-btn" 
              [class.active]="teamPossession() === 'OPPONENT'"
              (click)="onPossessionChange('OPPONENT')"
              [disabled]="disabled">
        Rival
      </button>
      <button type="button" 
              class="possession-segment-btn" 
              [class.active]="teamPossession() === 'NEUTRAL'"
              (click)="onPossessionChange('NEUTRAL')"
              [disabled]="disabled">
        Neutral
      </button>
    </div>
  </div>

  <!-- 3. Asignación de Jugador -->
  <div class="form-group mb-2">
    <label class="form-label-sport">Jugador</label>
    <div *ngIf="teamPossession() === 'OPPONENT'" class="opponent-notice">
      <i class="bi bi-info-circle me-1"></i> Jugada del equipo rival (no asignable)
    </div>
    <div *ngIf="teamPossession() !== 'OPPONENT'">
      <select class="form-select custom-sport-select"
              [ngModel]="playerId() || ''"
              (ngModelChange)="onPlayerChange($event)"
              [disabled]="disabled">
        <option value="">Sin asignar (Pendiente)</option>
        <option *ngFor="let p of store.availablePlayers()" [value]="p.id">
          {{ p.jerseyNumber ? '#' + p.jerseyNumber + ' ' : '' }}{{ p.fullName }}
        </option>
      </select>
    </div>
  </div>

  <!-- 4. Período y tiempo: una fila (1T/2T + reloj mm:ss); la regla del 2T va en el "?" -->
  <div *ngIf="showTimeFields" class="form-group mb-2" #timeFields (focusout)="onTimeFocusOut($event, timeFields)">
    <div class="time-label-row">
      <label class="form-label-sport mb-0">Período y tiempo *</label>
      <button type="button" class="rule-help tip-start" data-testid="time-help"
              [attr.aria-label]="timeHelp" [attr.data-tip]="timeHelp" [title]="timeHelp">?</button>
      <span *ngIf="periodHint() as hint" class="prefill-hint">{{ hint }}</span>
      <span *ngIf="timeHint() as hint" class="prefill-hint">{{ hint }}</span>
    </div>

    <div class="time-row">
      <div class="possession-segmented time-period">
        <button type="button"
                class="possession-segment-btn"
                [class.active]="period() === 1"
                aria-label="1° Tiempo"
                (click)="onPeriodChange(1)"
                [disabled]="disabled">
          1T
        </button>
        <button type="button"
                class="possession-segment-btn"
                [class.active]="period() === 2"
                aria-label="2° Tiempo"
                (click)="onPeriodChange(2)"
                [disabled]="disabled">
          2T
        </button>
      </div>

      <div class="time-clock">
        <input type="number"
               class="form-control custom-sport-input time-input"
               [class.is-invalid]="timeError()"
               [ngModel]="minute()"
               (ngModelChange)="onMinuteChange($event)"
               inputmode="numeric"
               min="0"
               max="80"
               placeholder="mm"
               aria-label="Minuto"
               [disabled]="disabled">
        <span class="time-colon" aria-hidden="true">:</span>
        <input type="number"
               class="form-control custom-sport-input time-input"
               [ngModel]="second()"
               (ngModelChange)="onSecondChange($event)"
               inputmode="numeric"
               min="0"
               max="59"
               placeholder="ss"
               aria-label="Segundo"
               [disabled]="disabled">
      </div>
    </div>

    <div class="time-equivalent" *ngIf="matchTimeEquivalent() as equivalent">= {{ equivalent }} de partido</div>
    <div class="invalid-feedback-sport" *ngIf="timeError() as error">
      <i class="bi bi-exclamation-circle-fill"></i>
      <span>{{ error }}</span>
    </div>
  </div>

  <!-- Enriquecimiento Táctico Dinámico -->
  <div class="enrichment-section" *ngIf="showEnrichmentSlot && currentTemplateFields().length > 0">
    <div class="d-flex align-items-center gap-2 mb-2">
      <i class="bi bi-sliders text-success"></i>
      <span class="form-label-sport mb-0">Enriquecimiento táctico</span>
    </div>

    <div *ngFor="let field of currentTemplateFields()" class="form-group mb-2">
      <label class="form-label-sport">
        {{ field.label }}
        <span *ngIf="field.required" class="text-danger">*</span>
      </label>

      <!-- 1. SELECT -->
      <div *ngIf="field.type === 'select'">
        <select class="form-select custom-sport-select"
                [ngModel]="getAttributeValue(field.key) || ''"
                (ngModelChange)="onAttributeChange(field.key, $event)"
                [disabled]="disabled">
          <option value="">Seleccionar {{ field.label.toLowerCase() }}...</option>
          <option *ngFor="let opt of field.options" [value]="opt.value">
            {{ opt.label }}
          </option>
        </select>
      </div>

      <!-- 2. NUMBER -->
      <div *ngIf="field.type === 'number'">
        <input type="number"
               class="form-control custom-sport-input"
               [class.is-invalid]="isFieldInvalid(field)"
               [ngModel]="getAttributeValue(field.key)"
               (ngModelChange)="onNumericAttributeChange(field.key, $event)"
               [min]="field.min != null ? field.min : null"
               [max]="field.max != null ? field.max : null"
               [placeholder]="getNumberPlaceholder(field)"
               [disabled]="disabled">
        <div class="invalid-feedback-sport" *ngIf="isFieldInvalid(field)">
          <i class="bi bi-exclamation-circle-fill"></i>
          <span>{{ getFieldValidationMessage(field) }}</span>
        </div>
      </div>

      <!-- 3. BOOLEAN -->
      <div *ngIf="field.type === 'boolean'" class="form-check form-switch custom-sport-switch">
        <input class="form-check-input" 
               type="checkbox" 
               role="switch"
               [id]="'switch-' + field.key"
               [checked]="getAttributeValue(field.key) === true"
               (change)="onAttributeChange(field.key, $any($event.target).checked)"
               [disabled]="disabled">
        <label class="form-check-label ms-2" [for]="'switch-' + field.key">
          {{ getAttributeValue(field.key) === true ? (field.trueLabel || 'Sí') : (field.falseLabel || 'No') }}
        </label>
      </div>
    </div>
  </div>
</div>
