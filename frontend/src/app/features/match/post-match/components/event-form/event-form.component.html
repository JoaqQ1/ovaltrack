<div class="event-form-container">
  <!-- 1. Tipo de Jugada -->
  <div class="form-group mb-3">
    <label class="form-label-sport">Tipo de jugada *</label>
    <select class="form-select custom-sport-select"
            [ngModel]="eventTypeId()"
            (ngModelChange)="onEventTypeChange($event)"
            [disabled]="disabled">
      <option value="" disabled>Seleccionar tipo de jugada...</option>
      <option *ngFor="let t of store.eventTypesList()" [value]="t.id">
        {{ t.name }}
      </option>
    </select>
  </div>

  <!-- 2. Posesión / Equipo -->
  <div class="form-group mb-3">
    <label class="form-label-sport">Posesión *</label>
    <div class="possession-segmented">
      <button type="button" 
              class="possession-segment-btn" 
              [class.active]="teamPossession() === 'OWN'"
              (click)="onPossessionChange('OWN')"
              [disabled]="disabled">
        Propia
      </button>
      <button type="button" 
              class="possession-segment-btn" 
              [class.active]="teamPossession() === 'OPPONENT'"
              (click)="onPossessionChange('OPPONENT')"
              [disabled]="disabled">
        Rival
      </button>
      <button type="button" 
              class="possession-segment-btn" 
              [class.active]="teamPossession() === 'NEUTRAL'"
              (click)="onPossessionChange('NEUTRAL')"
              [disabled]="disabled">
        Neutral
      </button>
    </div>
  </div>

  <!-- 3. Asignación de Jugador -->
  <div class="form-group mb-3">
    <label class="form-label-sport">Jugador</label>
    <div *ngIf="teamPossession() === 'OPPONENT'" class="opponent-notice">
      <i class="bi bi-info-circle me-1"></i> Jugada del equipo rival (no asignable)
    </div>
    <div *ngIf="teamPossession() !== 'OPPONENT'">
      <select class="form-select custom-sport-select"
              [ngModel]="playerId() || ''"
              (ngModelChange)="onPlayerChange($event)"
              [disabled]="disabled">
        <option value="">Sin asignar (Pendiente)</option>
        <option *ngFor="let p of store.availablePlayers()" [value]="p.id">
          {{ p.jerseyNumber ? '#' + p.jerseyNumber + ' ' : '' }}{{ p.fullName }}
        </option>
      </select>
    </div>
  </div>

  <!-- 4. Campos Opcionales de Tiempo (Período y Minutos/Segundos) -->
  <ng-container *ngIf="showTimeFields">
    <div class="form-group mb-3">
      <label class="form-label-sport">Período *</label>
      <div class="possession-segmented">
        <button type="button" 
                class="possession-segment-btn" 
                [class.active]="period() === 1"
                (click)="onPeriodChange(1)"
                [disabled]="disabled">
          1° Tiempo
        </button>
        <button type="button" 
                class="possession-segment-btn" 
                [class.active]="period() === 2"
                (click)="onPeriodChange(2)"
                [disabled]="disabled">
          2° Tiempo
        </button>
      </div>
    </div>

    <div class="row g-2">
      <div class="col-6">
        <label class="form-label-sport">Minuto (0-40)</label>
        <input type="number" 
               class="form-control custom-sport-input"
               [ngModel]="minute()"
               (ngModelChange)="onMinuteChange($event)"
               min="0"
               max="80"
               [disabled]="disabled">
      </div>
      <div class="col-6">
        <label class="form-label-sport">Segundo (0-59)</label>
        <input type="number" 
               class="form-control custom-sport-input"
               [ngModel]="second()"
               (ngModelChange)="onSecondChange($event)"
               min="0"
               max="59"
               [disabled]="disabled">
      </div>
    </div>
    <div class="mt-1 small text-muted">
      <span *ngIf="period() === 1">Tiempo de juego: 1T {{ formattedDisplayTime }} (máx. 40 min)</span>
      <span *ngIf="period() === 2">Tiempo de juego: 2T {{ formattedDisplayTime }} &bull; Equivale al <strong>minuto {{ formattedMatchTotalTime }}</strong> de partido</span>
    </div>
  </ng-container>

  <!-- 5. Enriquecimiento Táctico y Notas (Andamiaje preparado para HU compañero) -->
  <ng-container *ngIf="showEnrichmentFields">
    <div class="enrichment-divider"></div>
    <div class="enrichment-section">
      <div class="enrichment-header">
        <span class="enrichment-badge">DETALLES TÁCTICOS</span>
        <span class="enrichment-optional">(OPCIONAL)</span>
      </div>

      <!-- Causa reglamentaria si es Penal o Tarjeta -->
      <div class="form-group mb-2" *ngIf="isDisciplinaryOrPenalty()">
        <label class="form-label-sport">Causa reglamentaria</label>
        <select class="form-select custom-sport-select"
                [ngModel]="infractionCause()"
                (ngModelChange)="onInfractionCauseChange($event)"
                [disabled]="disabled">
          <option value="">Seleccionar causa raíz...</option>
          <option value="Offside / Fuera de juego">Offside / Fuera de juego</option>
          <option value="No liberar en ruck">No liberar en ruck</option>
          <option value="No soltar al jugador tackleado">No soltar al jugador tackleado</option>
          <option value="Tackle alto / peligroso">Tackle alto / peligroso</option>
          <option value="Derrumbe intencional (Maul / Scrum)">Derrumbe intencional (Maul / Scrum)</option>
          <option value="Infracción en formación fija">Infracción en formación fija (Entrada / Giro)</option>
          <option value="Inconducta antideportiva">Inconducta antideportiva</option>
          <option value="Reiteración de faltas">Reiteración de faltas de equipo</option>
        </select>
      </div>

      <!-- Metros de empuje si es Scrum -->
      <div class="form-group mb-2" *ngIf="isScrum()">
        <label class="form-label-sport">Empuje en scrum (Metros)</label>
        <div class="scrum-meters-control">
          <div class="scrum-quick-pills">
            <button type="button" 
                    class="scrum-pill-btn" 
                    [class.active]="scrumPushMeters() === -5"
                    (click)="onScrumPushMetersChange(-5)"
                    [disabled]="disabled">
              -5m
            </button>
            <button type="button" 
                    class="scrum-pill-btn" 
                    [class.active]="scrumPushMeters() === -2"
                    (click)="onScrumPushMetersChange(-2)"
                    [disabled]="disabled">
              -2m
            </button>
            <button type="button" 
                    class="scrum-pill-btn" 
                    [class.active]="scrumPushMeters() === 0"
                    (click)="onScrumPushMetersChange(0)"
                    [disabled]="disabled">
              0m
            </button>
            <button type="button" 
                    class="scrum-pill-btn" 
                    [class.active]="scrumPushMeters() === 2"
                    (click)="onScrumPushMetersChange(2)"
                    [disabled]="disabled">
              +2m
            </button>
            <button type="button" 
                    class="scrum-pill-btn" 
                    [class.active]="scrumPushMeters() === 5"
                    (click)="onScrumPushMetersChange(5)"
                    [disabled]="disabled">
              +5m
            </button>
          </div>
          <div class="scrum-input-wrap">
            <input type="number" 
                   class="form-control custom-sport-input scrum-input" 
                   [ngModel]="scrumPushMeters()"
                   (ngModelChange)="onScrumPushMetersChange($event)"
                   placeholder="Metros (+ avance / - retroceso)..."
                   min="-20"
                   max="20"
                   [disabled]="disabled">
            <span class="scrum-unit">m</span>
          </div>
        </div>
      </div>

      <!-- Notas tácticas comunes a todo evento -->
      <div class="form-group mb-1">
        <label class="form-label-sport">Notas del evento</label>
        <textarea class="form-control custom-sport-textarea"
                  rows="2"
                  [ngModel]="notes()"
                  (ngModelChange)="onNotesChange($event)"
                  placeholder="Observaciones para el staff o videoanálisis..."
                  [disabled]="disabled">
        </textarea>
      </div>
    </div>
  </ng-container>
</div>
