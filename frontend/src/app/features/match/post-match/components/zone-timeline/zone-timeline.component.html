<div class="timeline" role="group" aria-label="Tramos del partido de 0 a 80 minutos">
  <div class="halves" aria-hidden="true">
    <span class="half">1T · 0–40′</span>
    <span class="half">2T · 40–80′</span>
  </div>

  <div class="marks" data-testid="timeline-marks">
    <button *ngFor="let mark of marks()" type="button" class="mark" data-testid="timeline-mark"
            [class.mark-try]="mark.kind === 'try'" [class.mark-card]="mark.kind === 'card'"
            [class.mark-kick]="mark.kind === 'kick'"
            [style.left.%]="mark.left" [disabled]="readOnly()"
            [attr.aria-label]="mark.ariaLabel" [title]="mark.tooltip"
            (click)="selectMark(mark)">
      <span class="mark-glyph" aria-hidden="true">{{ mark.glyph }}</span>
      <span *ngIf="mark.addedCount > 0" class="mark-added" data-testid="mark-added">+{{ mark.addedCount }}</span>
      <span *ngIf="mark.count > 1 && mark.addedCount === 0" class="mark-added">{{ mark.count }}</span>
    </button>
  </div>

  <div class="track">
    <button *ngFor="let gap of gaps()" type="button" class="gap" data-testid="timeline-gap"
            [style.left.%]="gap.left" [style.width.%]="gap.width"
            [disabled]="readOnly()" [attr.aria-label]="gap.aria" [title]="gap.aria"
            (click)="selectGap(gap.selection)">
      <span class="gap-label">Sin zona</span>
    </button>

    <button *ngFor="let bar of segments()" type="button" class="segment" data-testid="timeline-segment"
            [class.terr-rival]="bar.territory.side === 'rival'" [style.--terr-w]="bar.territory.weight"
            [class.is-conflict]="bar.assignment.id === conflictId()"
            [style.left.%]="bar.left" [style.width.%]="bar.width"
            [disabled]="readOnly()" [attr.aria-label]="bar.aria" [title]="bar.aria"
            (click)="selectSegment(bar.assignment)">
      <span class="segment-label">{{ bar.label }}</span>
    </button>

    <span class="half-mark" [style.left.%]="halfMark" aria-hidden="true"></span>
  </div>

  <div class="ticks" aria-hidden="true">
    <span *ngFor="let tick of ticks" class="tick" [style.left.%]="tick.left">{{ tick.minute }}′</span>
  </div>

  <div class="legend">
    <span class="legend-item"><span class="legend-glyph" aria-hidden="true">▲</span> Try <span class="legend-glyph" aria-hidden="true">●</span> Patada <span class="legend-glyph" aria-hidden="true">■</span> Tarjeta</span>
    <span class="legend-item" data-testid="territory-legend">
      Campo propio <i class="swatch swatch-territory" aria-hidden="true"></i> Campo rival
    </span>
    <span class="legend-item"><i class="swatch swatch-gap"></i> Sin zona{{ readOnly() ? '' : ' (tocá para completar)' }}</span>
  </div>
</div>
