<header class="hud-container">
  <div class="hud-main">
    <button
      type="button"
      class="hud-back"
      (click)="onBack()"
      aria-label="Volver a partidos"
      title="Volver a partidos"
    >
      <i class="bi bi-arrow-left"></i>
    </button>

    <div class="hud-content">
      <div class="badge-tech">
        <span>Análisis • Post-partido</span>
      </div>

      <h1 class="hud-title">
        <span class="club-name">{{ ownClubName }}</span>

        <span class="score-wrapper" [attr.aria-label]="'Marcador: ' + homeScore + ' a ' + awayScore">
          <span class="match-score-pill">
            <span class="score-num">{{ homeScore }}</span>
            <span class="score-sep">–</span>
            <span class="score-num">{{ awayScore }}</span>
          </span>
          @if (scoreDelta) {
            <span
              class="score-delta-badge"
              aria-live="polite"
              [title]="'Actualización de marcador: ' + scoreDelta.text"
            >
              {{ scoreDelta.text }}
            </span>
          }
        </span>

        <span class="club-name">{{ opponentName }}</span>
      </h1>

      <p class="hud-subtitle">Hora de inicio {{ startTimeFormatted }}</p>
    </div>
  </div>

  <div class="hud-right">
    <nav class="view-switch" aria-label="Vistas del análisis">
      @for (option of viewOptions; track option.label) {
        <a
          class="view-option"
          [routerLink]="option.path"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          [routerLinkActiveOptions]="{ exact: option.exact }"
        >
          <i class="bi" [class]="option.icon"></i>
          <span>{{ option.label }}</span>
        </a>
      }
    </nav>
  </div>
</header>
