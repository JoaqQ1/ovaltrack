<section class="events-card">
  <div class="events-head">
    <h2 class="section-title">{{ title() }}</h2>
    <span *ngIf="!hint()" class="count-pill" data-testid="events-count">{{ events().length }}</span>
  </div>

  <p *ngIf="subtitle()" class="events-subtitle" data-testid="events-subtitle">{{ subtitle() }}</p>

  <p *ngIf="hint() as text" class="events-empty" data-testid="events-hint">{{ text }}</p>

  <ng-container *ngIf="!hint()">
    <p *ngIf="events().length === 0" class="events-empty" data-testid="events-empty">{{ emptyText() }}</p>

    <ul *ngIf="events().length > 0" class="events-list">
      <li *ngFor="let event of events()" class="event-row" data-testid="event-row">
        <span class="event-time">{{ time(event) }}</span>
        <span class="event-period">{{ event.period }}T</span>
        <span class="event-main">
          <span class="event-type">{{ event.eventTypeName }}</span>
          <span class="event-player" [class.is-missing]="!event.playerName">{{ player(event) }}</span>
        </span>
      </li>
    </ul>
  </ng-container>
</section>
