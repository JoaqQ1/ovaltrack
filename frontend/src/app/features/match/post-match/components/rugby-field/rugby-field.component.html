<figure class="rugby-field">
  <!-- Sentido de ataque y línea de lectura de la zona apuntada -->
  <div class="field-head">
    <span class="attack-dir" data-testid="attack-dir">
      <strong>{{ ownClubName() }} ataca</strong>
      <svg viewBox="0 0 120 12" width="120" height="12" aria-hidden="true">
        <line x1="0" y1="6" x2="112" y2="6" stroke="currentColor" stroke-width="2.5" />
        <path d="M104 1 L117 6 L104 11 Z" fill="currentColor" />
      </svg>
    </span>
    <span class="reading" data-testid="zone-reading" aria-live="polite">{{ reading() }}</span>
  </div>

  <div class="field-frame">
    <!-- Eje de filas (izquierda / centro / derecha con su rango desde la touch) -->
    <div class="row-axis" aria-hidden="true">
      <div *ngFor="let row of rowAxis" class="row-axis-item" [style.flex-grow]="row.meters">
        <span class="row-axis-letter">{{ row.letter }}</span>
        <span class="row-axis-name">{{ row.name }}</span>
        <span class="row-axis-range">{{ row.range }}</span>
      </div>
    </div>

    <div class="pitch">
      <!-- Fondo: solo dibujo, no interactivo -->
      <svg class="pitch-bg" [attr.viewBox]="'0 0 ' + width + ' ' + height" preserveAspectRatio="none" aria-hidden="true" focusable="false">
        <rect class="grass" x="0" y="0" [attr.width]="width" [attr.height]="height" />
        <rect *ngFor="let i of stripes" class="stripe" [class.odd]="i % 2 === 1" [attr.x]="i * 100" y="0" width="100" [attr.height]="height" />
        <rect class="ingoal" x="0" y="0" [attr.width]="goalLineLeft" [attr.height]="height" />
        <rect class="ingoal" [attr.x]="goalLineRight" y="0" [attr.width]="width - goalLineRight" [attr.height]="height" />

        <g class="lines">
          <rect class="boundary" x="0" y="0" [attr.width]="width" [attr.height]="height" />
          <line [attr.x1]="goalLineLeft" y1="0" [attr.x2]="goalLineLeft" [attr.y2]="height" />
          <line [attr.x1]="goalLineRight" y1="0" [attr.x2]="goalLineRight" [attr.y2]="height" />
          <line [attr.x1]="line22Left" y1="0" [attr.x2]="line22Left" [attr.y2]="height" />
          <line [attr.x1]="line22Right" y1="0" [attr.x2]="line22Right" [attr.y2]="height" />
          <line class="halfway" [attr.x1]="halfway" y1="0" [attr.x2]="halfway" [attr.y2]="height" />
          <line class="dashed" [attr.x1]="line10Left" y1="0" [attr.x2]="line10Left" [attr.y2]="height" />
          <line class="dashed" [attr.x1]="line10Right" y1="0" [attr.x2]="line10Right" [attr.y2]="height" />
          <!-- 5 m y 15 m desde cada touch; las de 15 m coinciden con los bordes de fila -->
          <line class="dashed" [attr.x1]="goalLineLeft" [attr.y1]="line5Top" [attr.x2]="goalLineRight" [attr.y2]="line5Top" />
          <line class="dashed" [attr.x1]="goalLineLeft" [attr.y1]="line5Bottom" [attr.x2]="goalLineRight" [attr.y2]="line5Bottom" />
          <line class="dashed" [attr.x1]="goalLineLeft" [attr.y1]="line15Top" [attr.x2]="goalLineRight" [attr.y2]="line15Top" />
          <line class="dashed" [attr.x1]="goalLineLeft" [attr.y1]="line15Bottom" [attr.x2]="goalLineRight" [attr.y2]="line15Bottom" />
          <!-- Palos (H): travesaño y dos postes, con punta redondeada que no se deforma -->
          <g class="posts">
            <line [attr.x1]="goalLineLeft" [attr.y1]="postTop" [attr.x2]="goalLineLeft" [attr.y2]="postBottom" />
            <line [attr.x1]="goalLineRight" [attr.y1]="postTop" [attr.x2]="goalLineRight" [attr.y2]="postBottom" />
            <line class="post-dot" [attr.x1]="goalLineLeft" [attr.y1]="postTop" [attr.x2]="goalLineLeft" [attr.y2]="postTop + 0.01" />
            <line class="post-dot" [attr.x1]="goalLineLeft" [attr.y1]="postBottom" [attr.x2]="goalLineLeft" [attr.y2]="postBottom + 0.01" />
            <line class="post-dot" [attr.x1]="goalLineRight" [attr.y1]="postTop" [attr.x2]="goalLineRight" [attr.y2]="postTop + 0.01" />
            <line class="post-dot" [attr.x1]="goalLineRight" [attr.y1]="postBottom" [attr.x2]="goalLineRight" [attr.y2]="postBottom + 0.01" />
          </g>
        </g>
      </svg>

      <!-- Grilla 3x6 accesible (role=grid, flechas, una sola parada de Tab) -->
      <div class="pitch-grid" role="grid" [attr.aria-label]="gridLabel()" [attr.aria-readonly]="!selectable()">
        <div class="pitch-row" role="row" *ngFor="let line of fieldRows(); let r = index"
             [style.flex-grow]="rowMeters[r]" [style.grid-template-columns]="columnTemplate">
          <div *ngFor="let cell of line"
               role="gridcell"
               data-testid="zone-cell"
               class="field-cell"
               [class.has-events]="cell.count > 0"
               [class.is-selected]="isSelected(cell)"
               [class.is-readonly]="!selectable()"
               [attr.data-row]="cell.row"
               [attr.data-col]="cell.col"
               [attr.aria-selected]="isSelected(cell)"
               [attr.aria-label]="ariaLabel(cell)"
               [attr.tabindex]="isTabStop(cell) ? 0 : -1"
               [style.--heat]="cell.heat"
               (click)="select(cell)"
               (mouseenter)="onEnter(cell)"
               (mouseleave)="onLeave()"
               (focus)="onFocus(cell)"
               (blur)="onLeave()"
               (keydown)="onKeydown($event, cell)">
            <span class="cell-label" data-testid="zone-label">{{ cell.label }}</span>
            <span *ngIf="cell.count > 0" class="cell-count" data-testid="zone-count">{{ cell.count }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Eje de columnas: número, nombre y metros -->
  <div class="col-axis-wrap">
    <div class="col-axis" [style.grid-template-columns]="columnTemplate" aria-hidden="true">
      <div *ngFor="let col of columnAxis" class="col-axis-item">
        <span class="col-axis-number">{{ col.number }}</span>
        <span class="col-axis-name">{{ col.name }}</span>
        <span class="col-axis-range">{{ col.range }}</span>
      </div>
    </div>
  </div>
  <p class="col-legend">Columnas: {{ columnLegend }}.</p>

  <figcaption class="field-notes">
    <p class="relative-note">
      Vista relativa a tu equipo: siempre atacás hacia la derecha. En el 2T marcá como si no hubiera cambio de lado.
      Izquierda y derecha se leen mirando hacia el ataque.
    </p>
    <p *ngIf="isEmpty()" class="field-empty" data-testid="zones-empty">
      Todavía no hay eventos vinculados a una zona. Asigná un tramo del partido a una zona para verlos acá.
    </p>
    <p *ngIf="unzonedEventCount() > 0" class="field-unzoned" data-testid="unzoned-notice">
      <i class="bi bi-exclamation-circle"></i>
      {{ unzonedEventCount() }} {{ unzonedEventCount() === 1 ? 'evento sin zona' : 'eventos sin zona' }}
    </p>
  </figcaption>
</figure>
