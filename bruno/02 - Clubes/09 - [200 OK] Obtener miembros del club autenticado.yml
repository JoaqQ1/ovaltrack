info:
  name: 09 - [200 OK] Obtener miembros del club autenticado
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/club/my-club/members"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Debe responder 200 OK con los miembros del club", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody()).to.be.an('array');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
