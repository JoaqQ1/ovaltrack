info:
  name: 02 - [200 OK] Obtener Mi Club (Admin)
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/club/my-club"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Debe responder 200 OK con el club del admin", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().name).to.equal("Puerto Madryn Rugby Club");
          bru.setEnvVar("clubId", res.getBody().id);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
