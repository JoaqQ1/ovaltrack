info:
  name: 06 - [409 Conflict] Error asignar jugador fuera de plantel
  type: http
  seq: 6

http:
  method: PATCH
  url: "{{baseUrl}}/event/{{targetEventId}}"
  headers:
    - name: Authorization
      value: Bearer {{coachToken}}
  body:
    type: json
    data: |-
      {
        "playerId": "{{unassignedPersonId}}",
        "teamPossession": "OWN"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Debe rechazar con 409 Conflict al asignar jugador no convocado", function() {
          expect(res.getStatus()).to.equal(409);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
