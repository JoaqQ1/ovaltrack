info:
  name: 03 - [409 Conflict] Error consultar post-match en partido no cerrado
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/event/match/post-match?matchId={{matchId}}"
  headers:
    - name: Authorization
      value: Bearer {{coachToken}}
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Debe responder 409 Conflict porque el partido esta en curso (no cerrado)", function() {
          expect(res.getStatus()).to.equal(409);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
