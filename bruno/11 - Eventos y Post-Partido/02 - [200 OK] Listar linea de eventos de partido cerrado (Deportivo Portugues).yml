info:
  name: 02 - [200 OK] Listar linea de eventos de partido cerrado (Deportivo Portugues)
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/event/match/post-match?matchId={{matchFinishedPortuguesId}}"
  headers:
    - name: Authorization
      value: Bearer {{coachToken}}
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Debe responder 200 OK con los eventos de Deportivo Portugues", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody()).to.be.an('array');
          expect(res.getBody().length).to.be.greaterThan(0);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
