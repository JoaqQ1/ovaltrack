info:
  name: 07 - [200 OK] Obtener partido finalizado Puerto Madryn
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/matches/{{matchFinishedPuertoMadrynId}}"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Debe responder 200 OK con datos del partido finalizado Puerto Madryn", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().id).to.equal(bru.getEnvVar("matchFinishedPuertoMadrynId"));
          expect(res.getBody().opponent).to.equal("Puerto Madryn RC");
          expect(res.getBody().status).to.equal("FINISHED");
          expect(res.getBody()).to.have.property('homeScore');
          expect(res.getBody()).to.have.property('awayScore');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
