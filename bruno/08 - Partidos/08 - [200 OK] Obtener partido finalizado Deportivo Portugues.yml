info:
  name: 08 - [200 OK] Obtener partido finalizado Deportivo Portugues
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/matches/{{matchFinishedPortuguesId}}"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Debe responder 200 OK con datos del partido finalizado Deportivo Portugues", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().id).to.equal(bru.getEnvVar("matchFinishedPortuguesId"));
          expect(res.getBody().opponent).to.equal("Deportivo Portugués");
          expect(res.getBody().status).to.equal("FINISHED");
          expect(res.getBody()).to.have.property('homeScore');
          expect(res.getBody()).to.have.property('awayScore');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
