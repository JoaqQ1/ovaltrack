info:
  name: 04 - [200 OK] Obtener partido creado por ID
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/matches/{{newMatchId}}"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Debe responder 200 OK con datos del partido recien creado", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().id).to.equal(bru.getEnvVar("newMatchId"));
          expect(res.getBody().opponent).to.equal("Bigornia Club");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
