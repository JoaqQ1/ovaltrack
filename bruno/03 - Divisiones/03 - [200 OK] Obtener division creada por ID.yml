info:
  name: 03 - [200 OK] Obtener division creada por ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/division/{{newDivisionId}}"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Debe responder 200 OK con la division recien creada", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().id).to.equal(bru.getEnvVar("newDivisionId"));
          expect(res.getBody().name).to.equal("M18 DEMO");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
