info:
  name: 07 - [409 Conflict] Admin intenta darse de baja a si mismo
  type: http
  seq: 7

http:
  method: PATCH
  url: "{{baseUrl}}/user/11111111-1111-1111-1111-000000000001/baja"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Debe rechazar con 409 Conflict si el admin intenta darse de baja a si mismo", function() {
          expect(res.getStatus()).to.equal(409);
          expect(res.getBody().message).to.equal("No puede darse de baja mientras sea el administrador designado de un club");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
