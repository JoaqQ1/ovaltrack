info:
  name: 08 - [403 Forbidden] Player intenta dar de baja usuario
  type: http
  seq: 8

http:
  method: PATCH
  url: "{{baseUrl}}/user/{{targetUserId}}/baja"
  headers:
    - name: Authorization
      value: Bearer {{playerToken}}
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Debe rechazar con 403 Forbidden cuando un jugador intenta dar de baja un usuario", function() {
          expect(res.getStatus()).to.equal(403);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
