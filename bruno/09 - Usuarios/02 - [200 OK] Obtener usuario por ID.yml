info:
  name: 02 - [200 OK] Obtener usuario por ID
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/user/{{targetUserId}}"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Debe responder 200 OK con los datos del usuario", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().id).to.equal(bru.getEnvVar("targetUserId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
