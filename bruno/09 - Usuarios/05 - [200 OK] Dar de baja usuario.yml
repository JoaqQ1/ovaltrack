info:
  name: 05 - [200 OK] Dar de baja usuario
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{baseUrl}}/user/{{targetUserId}}/baja"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Debe responder 200 OK y marcar usuario inactivo", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().active).to.equal(false);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
