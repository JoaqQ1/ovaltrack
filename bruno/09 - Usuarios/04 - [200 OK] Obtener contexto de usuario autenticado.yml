info:
  name: 04 - [200 OK] Obtener contexto de usuario autenticado
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/me"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Debe responder 200 OK con contexto de usuario", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody()).to.have.property('user');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
