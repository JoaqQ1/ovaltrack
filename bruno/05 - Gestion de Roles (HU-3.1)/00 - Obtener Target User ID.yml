info:
  name: 00 - Obtener Target User ID
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/user"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const users = res.getBody();
        const player = users.find(u => u.loginEmail === "player10@ovaltrack.com" || u.email === "player10@ovaltrack.com");
        if (player) {
          bru.setEnvVar("targetUserId", player.id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
