info:
  name: 02 - [409 Conflict] Admin intenta asignar Superadmin
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{baseUrl}}/user/{{targetUserId}}/role"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  body:
    type: json
    data: |-
      {
        "role": "ADMIN_OVALTRACK"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Debe rechazar con 409 Conflict", function() {
          expect(res.getStatus()).to.equal(409);
          expect(res.getBody().message).to.equal("El administrador de club no puede asignar el rol ADMIN_OVALTRACK");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
