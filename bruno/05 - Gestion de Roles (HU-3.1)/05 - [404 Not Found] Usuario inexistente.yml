info:
  name: 05 - [404 Not Found] Usuario inexistente
  type: http
  seq: 6

http:
  method: PATCH
  url: "{{baseUrl}}/user/00000000-0000-0000-0000-000000000000/role"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  body:
    type: json
    data: |-
      {
        "role": "COACH_ANALYST"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Debe responder 404 Not Found", function() {
          expect(res.getStatus()).to.equal(404);
          expect(res.getBody().message).to.equal("Usuario no encontrado");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
