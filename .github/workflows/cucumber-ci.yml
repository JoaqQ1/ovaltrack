name: CI - Pruebas de Cucumber

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  cucumber-tests:
    runs-on: ubuntu-latest 

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Dar permisos de ejecución al script
        run: chmod +x ds

      - name: Levantar contenedores base (Backend, DB, etc.)
        run: ./ds up

      - name: Esperar a que los servicios estén listos
        run: sleep 60

      - name: Ejecutar tests de Cucumber
        run: ./ds test
